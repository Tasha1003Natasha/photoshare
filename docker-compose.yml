services:
  db:
    image: postgres:16
    container_name: photoshare
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: photoshare_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
     - "${REDIS_PORT}:6379"
volumes:
   postgres_data: